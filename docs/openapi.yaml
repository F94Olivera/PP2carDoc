openapi: 3.0.3
info:
  title: carDoc API
  version: 0.1.0
  description: >-
    Browser API requests send x-region: us-west-2 to execute the hosted Edge Function
    near Postgres. This optional Supabase routing header is ignored locally.
    CORS allows x-region and exposes the x-sb-edge-region response header for
    execution-region verification. Explicit regional routing disables automatic
    cross-region failover.
servers:
  - url: http://127.0.0.1:54321/functions/v1/api
    description: Supabase Edge local
  - url: https://lsbgegbghlgxkqxpmgyx.supabase.co/functions/v1/api
    description: Supabase carDoc
# OPTIONS is public and handled by the gateway or Express CORS middleware.
# Bearer tokens authenticate protected routes; browser cookies are not used.
paths:
  /ping:
    get:
      responses:
        "200":
          description: Backend is running
  /login:
    post:
      summary: Authenticate with Supabase using email and password
      description: Returns a Supabase session for Bearer authentication.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated; Cache-Control is no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Invalid JSON or body
        "401":
          description: Invalid credentials or unavailable account
        "413":
          description: Body exceeds 8 KB
        "429":
          description: Supabase rate limit exceeded
        "503":
          description: Authentication unavailable or unconfigured
  /auth/me:
    get:
      summary: Retrieve the current authenticated user
      description: The middleware verifies the token with Supabase Auth, checks its active session and reads the current database role. Tokens older than 15 minutes are rejected. The controller returns that verified context.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user; Cache-Control is no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: Missing, malformed, invalid or expired Bearer token, or missing user
          headers:
            WWW-Authenticate:
              schema:
                type: string
                enum: [Bearer]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "429":
          description: Supabase rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "503":
          description: Authentication unavailable or unconfigured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
  /customers:
    get:
      summary: List customers
      description: |
        MECHANIC receives only customers it owns; GOD receives all customers, ordered by ID ascending.
        Counts and pagination use the same ownership scope.
        Archived customers are excluded unless includeArchived=true.
        Unknown or repeated query parameters are rejected. Pages beyond the last page
        return an empty data array and the requested page metadata.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            maximum: 9007199254740991
            default: 1
          description: The calculated offset must also be a safe integer.
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - in: query
          name: includeArchived
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Paginated customers; Cache-Control is no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerListResponse"
        "400":
          description: Invalid, unknown or repeated query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "401":
          description: Missing, malformed, invalid or expired Bearer token
          headers:
            WWW-Authenticate:
              schema:
                type: string
                enum: [Bearer]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "429":
          description: Supabase authentication rate limit exceeded
        "500":
          description: Database unavailable or unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "503":
          description: Authentication unavailable or unconfigured
    post:
      summary: Create a customer
      description: MECHANIC defaults to itself and cannot choose another owner. GOD must supply an existing MECHANIC mechanicId; GOD cannot own customers. Invalid or unauthorized owners return 403. Unknown body fields are rejected.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomerInput"
      responses:
        "201":
          description: Created customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
        "400":
          description: Invalid or undeclared body fields
        "401":
          description: Invalid token, expired token or inactive session
        "403":
          description: Owner must be an authorized existing MECHANIC
        "409":
          description: Duplicate document for this mechanic
        "413":
          description: Body exceeds 32 KB
        "429":
          description: Authentication rate limit
        "500":
          description: Unexpected database error
        "503":
          description: Authentication or authorization lookup unavailable
  /customers/{customerId}:
    get:
      summary: Retrieve a customer by ID
      description: Returns an active or archived customer owned by MECHANIC, or any customer for GOD. An inaccessible customer returns the same 404 as a missing customer.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: customerId
          required: true
          description: Positive decimal integer without leading zeros.
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      responses:
        "200":
          description: Customer; Cache-Control is no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
        "400":
          description: Invalid customer ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "401":
          description: Missing, malformed, invalid or expired Bearer token
          headers:
            WWW-Authenticate:
              schema:
                type: string
                enum: [Bearer]
        "404":
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "429":
          description: Supabase authentication rate limit exceeded
        "500":
          description: Database unavailable or unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "503":
          description: Authentication unavailable or unconfigured
    patch:
      summary: Update a customer
      description: MECHANIC can edit its customers; GOD can edit any customer, including archived customers. Send isActive false to archive or true to restore; this does not change vehicle archive flags. Archived customers remain accessible for explicit administration, not operational descendant access. mechanicId is immutable and rejected with 400 even for GOD.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: customerId
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCustomerInput"
      responses:
        "200":
          description: Updated customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
        "400":
          description: Invalid ID, empty body or undeclared fields
        "401":
          description: Invalid token or inactive session
        "404":
          description: Customer missing or inaccessible
        "409":
          description: Duplicate document for this mechanic
        "413":
          description: Body exceeds 32 KB
        "429":
          description: Authentication rate limit
        "500":
          description: Unexpected database error
        "503":
          description: Authentication or authorization lookup unavailable
    delete:
      summary: Delete a customer
      description: MECHANIC can delete its customers; GOD can delete any customer. Customers with vehicles cannot be deleted until their related records are removed.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: customerId
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      responses:
        "204":
          description: Customer deleted
        "400":
          description: Invalid ID
        "401":
          description: Invalid token or inactive session
        "404":
          description: Customer missing or inaccessible
        "409":
          description: Customer still has vehicles
        "429":
          description: Authentication rate limit
        "500":
          description: Unexpected database error
        "503":
          description: Authentication or authorization lookup unavailable
  /logout:
    post:
      summary: Sign out the current Supabase session
      description: |
        The shared requireAuth middleware validates the access token in Authorization
        before logout runs. Revokes only the current session's
        refresh tokens. Other sessions remain active. Subsequent requests using this
        session are rejected immediately by the API and database policies; the
        client must also delete its locally stored session tokens.
        No request body is used.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Session signed out; no body; Cache-Control is no-store
        "401":
          description: Missing, malformed, invalid or expired Bearer token
        "429":
          description: Supabase rate limit exceeded
        "503":
          description: Authentication unavailable or unconfigured
  /vehicles:
    get:
      operationId: ListVehicles
      summary: ListVehicles
      security:
        - bearerAuth: []
      description: >-
        Requires an active accessible customer; MECHANIC owns the customer and GOD has global scope.
        Archived vehicles remain administratively accessible under active customers.
        Plate uniqueness is per mechanic, case-insensitive and trimmed, including archived vehicles.
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
        - name: includeArchived
          in: query
          schema: { type: boolean, default: false }
        - name: customerId
          in: query
          schema: { type: integer, minimum: 1, maximum: 2147483647 }
      # Unknown/repeated parameters and unsafe offsets return 400; ordered by ID.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehiclePage"
        "400":
          description: Invalid body, query or ID
        "401":
          description: Invalid or expired Bearer session
        "404":
          description: Vehicle or active customer unavailable or outside authorized scope
        "409":
          description: Duplicate plate for mechanic or related work orders prevent deletion
        "403":
          description: Operation prohibited by database authorization
        "429":
          description: Authentication rate limit
        "503":
          description: Authentication unavailable
        "500":
          description: Unexpected error; no database details
    post:
      operationId: CreateVehicle
      summary: CreateVehicle
      security:
        - bearerAuth: []
      description: >-
        Requires an active accessible customer; MECHANIC owns the customer and GOD has global scope.
        Archived vehicles remain administratively accessible under active customers.
        Plate uniqueness is per mechanic, case-insensitive and trimmed, including archived vehicles.
        Bodies reject undeclared keys. Vehicle parent cannot change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVehicleInput"
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleResponse"
        "400":
          description: Invalid body, query or ID
        "401":
          description: Invalid or expired Bearer session
        "404":
          description: Vehicle or active customer unavailable or outside authorized scope
        "409":
          description: Duplicate plate for mechanic or related work orders prevent deletion
        "403":
          description: Operation prohibited by database authorization
        "429":
          description: Authentication rate limit
        "503":
          description: Authentication unavailable
        "500":
          description: Unexpected error; no database details
        "413":
          description: Body exceeds 32 KB (8 KB for archive)
  /vehicles/{vehicleId}:
    get:
      operationId: GetVehicle
      summary: GetVehicle
      security:
        - bearerAuth: []
      description: >-
        Requires an active accessible customer; MECHANIC owns the customer and GOD has global scope.
        Archived vehicles remain administratively accessible under active customers.
        Plate uniqueness is per mechanic, case-insensitive and trimmed, including archived vehicles.
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema: { type: integer, minimum: 1, maximum: 2147483647 }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleResponse"
        "400":
          description: Invalid body, query or ID
        "401":
          description: Invalid or expired Bearer session
        "404":
          description: Vehicle or active customer unavailable or outside authorized scope
        "409":
          description: Duplicate plate for mechanic or related work orders prevent deletion
        "403":
          description: Operation prohibited by database authorization
        "429":
          description: Authentication rate limit
        "503":
          description: Authentication unavailable
        "500":
          description: Unexpected error; no database details
    put:
      operationId: UpdateVehicle
      summary: UpdateVehicle
      security:
        - bearerAuth: []
      description: >-
        Requires an active accessible customer; MECHANIC owns the customer and GOD has global scope.
        Archived vehicles remain administratively accessible under active customers.
        Plate uniqueness is per mechanic, case-insensitive and trimmed, including archived vehicles.
        Bodies reject undeclared keys. Vehicle parent cannot change.
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema: { type: integer, minimum: 1, maximum: 2147483647 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVehicleInput"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleResponse"
        "400":
          description: Invalid body, query or ID
        "401":
          description: Invalid or expired Bearer session
        "404":
          description: Vehicle or active customer unavailable or outside authorized scope
        "409":
          description: Duplicate plate for mechanic or related work orders prevent deletion
        "403":
          description: Operation prohibited by database authorization
        "429":
          description: Authentication rate limit
        "503":
          description: Authentication unavailable
        "500":
          description: Unexpected error; no database details
        "413":
          description: Body exceeds 32 KB (8 KB for archive)
    delete:
      operationId: DeleteVehicle
      summary: DeleteVehicle
      security:
        - bearerAuth: []
      description: >-
        Requires an active accessible customer; MECHANIC owns the customer and GOD has global scope.
        Archived vehicles remain administratively accessible under active customers.
        Plate uniqueness is per mechanic, case-insensitive and trimmed, including archived vehicles.
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema: { type: integer, minimum: 1, maximum: 2147483647 }
      responses:
        "204":
          description: Success; no body
        "400":
          description: Invalid body, query or ID
        "401":
          description: Invalid or expired Bearer session
        "404":
          description: Vehicle or active customer unavailable or outside authorized scope
        "409":
          description: Duplicate plate for mechanic or related work orders prevent deletion
        "403":
          description: Operation prohibited by database authorization
        "429":
          description: Authentication rate limit
        "503":
          description: Authentication unavailable
        "500":
          description: Unexpected error; no database details
  /vehicles/{vehicleId}/archive:
    patch:
      operationId: ArchiveVehicle
      summary: ArchiveVehicle
      security:
        - bearerAuth: []
      description: >-
        Requires an active accessible customer; MECHANIC owns the customer and GOD has global scope.
        Archived vehicles remain administratively accessible under active customers.
        Plate uniqueness is per mechanic, case-insensitive and trimmed, including archived vehicles.
        Bodies reject undeclared keys. Vehicle parent cannot change.
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema: { type: integer, minimum: 1, maximum: 2147483647 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiveVehicleInput"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleResponse"
        "400":
          description: Invalid body, query or ID
        "401":
          description: Invalid or expired Bearer session
        "404":
          description: Vehicle or active customer unavailable or outside authorized scope
        "409":
          description: Duplicate plate for mechanic or related work orders prevent deletion
        "403":
          description: Operation prohibited by database authorization
        "429":
          description: Authentication rate limit
        "503":
          description: Authentication unavailable
        "500":
          description: Unexpected error; no database details
        "413":
          description: Body exceeds 32 KB (8 KB for archive)
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CustomerResponse:
      type: object
      additionalProperties: false
      required:
        [
          id,
          mechanicId,
          firstName,
          lastName,
          email,
          phone,
          address,
          documentNumber,
          notes,
          isActive,
          createdAt,
          updatedAt,
        ]
      properties:
        mechanicId:
          type: string
          format: uuid
        id:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        documentNumber:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PaginationMeta:
      type: object
      additionalProperties: false
      required: [page, pageSize, total, totalPages, hasNextPage, hasPreviousPage]
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
        hasNextPage:
          type: boolean
        hasPreviousPage:
          type: boolean
    CustomerListResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/CustomerResponse"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
    AuthError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
    UserResponse:
      type: object
      additionalProperties: false
      required: [id, email, role]
      properties:
        role:
          type: string
          enum: [GOD, MECHANIC]
        id:
          type: string
          format: uuid
        email:
          type: string
          nullable: true
    MeResponse:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/UserResponse"
    LoginInput:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 4096
    LoginResponse:
      type: object
      required: [user, session]
      properties:
        user:
          $ref: "#/components/schemas/UserResponse"
        session:
          type: object
          required: [access_token, refresh_token, token_type, expires_in]
          properties:
            access_token:
              type: string
            refresh_token:
              type: string
            token_type:
              type: string
            expires_in:
              type: integer
            expires_at:
              type: integer
    CreateCustomerInput:
      type: object
      additionalProperties: false
      required: [firstName]
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 200
        lastName:
          type: string
          nullable: true
          maxLength: 200
        email:
          type: string
          format: email
          nullable: true
          maxLength: 254
        phone:
          type: string
          nullable: true
          maxLength: 100
        address:
          type: string
          nullable: true
          maxLength: 1000
        documentNumber:
          type: string
          nullable: true
          minLength: 1
          maxLength: 100
        notes:
          type: string
          nullable: true
          maxLength: 10000
        mechanicId:
          type: string
          format: uuid
    UpdateCustomerInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        firstName:
          $ref: "#/components/schemas/CreateCustomerInput/properties/firstName"
        lastName:
          $ref: "#/components/schemas/CreateCustomerInput/properties/lastName"
        email:
          $ref: "#/components/schemas/CreateCustomerInput/properties/email"
        phone:
          $ref: "#/components/schemas/CreateCustomerInput/properties/phone"
        address:
          $ref: "#/components/schemas/CreateCustomerInput/properties/address"
        documentNumber:
          $ref: "#/components/schemas/CreateCustomerInput/properties/documentNumber"
        notes:
          $ref: "#/components/schemas/CreateCustomerInput/properties/notes"
        isActive:
          type: boolean
    UpdateVehicleInput:
      description: Full replacement of writable vehicle data; omitted year and initialOdometer become null.
      type: object
      additionalProperties: false
      required: [licensePlate, make, model, odometerUnit]
      properties:
        licensePlate:
          { type: string, minLength: 1, maxLength: 100, description: Trimmed and uppercased }
        make: { type: string, minLength: 1, maxLength: 200 }
        model: { type: string, minLength: 1, maxLength: 200 }
        year: { type: integer, nullable: true, minimum: 1886, maximum: 2147483647 }
        initialOdometer: { type: integer, nullable: true, minimum: 0, maximum: 2147483647 }
        odometerUnit: { type: string, enum: [km, mi] }
    CreateVehicleInput:
      type: object
      additionalProperties: false
      required: [customerId, licensePlate, make, model, odometerUnit]
      properties:
        customerId: { type: integer, minimum: 1, maximum: 2147483647 }
        licensePlate:
          { type: string, minLength: 1, maxLength: 100, description: Trimmed and uppercased }
        make: { type: string, minLength: 1, maxLength: 200 }
        model: { type: string, minLength: 1, maxLength: 200 }
        year: { type: integer, nullable: true, minimum: 1886, maximum: 2147483647 }
        initialOdometer: { type: integer, nullable: true, minimum: 0, maximum: 2147483647 }
        odometerUnit: { type: string, enum: [km, mi] }
    ArchiveVehicleInput:
      type: object
      additionalProperties: false
      required: [isActive]
      properties:
        isActive: { type: boolean }
    VehicleResponse:
      type: object
      additionalProperties: false
      required:
        [
          id,
          customerId,
          licensePlate,
          make,
          model,
          year,
          initialOdometer,
          odometerUnit,
          isActive,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: integer }
        customerId: { type: integer }
        licensePlate:
          { type: string, minLength: 1, maxLength: 100, description: Trimmed and uppercased }
        make: { type: string, minLength: 1, maxLength: 200 }
        model: { type: string, minLength: 1, maxLength: 200 }
        year: { type: integer, nullable: true, minimum: 1886, maximum: 2147483647 }
        initialOdometer: { type: integer, nullable: true, minimum: 0, maximum: 2147483647 }
        odometerUnit: { type: string, enum: [km, mi] }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    VehiclePage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/VehicleResponse"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
