openapi: 3.0.3
info:
  title: carDoc API
  version: 0.1.0
servers:
  - url: http://127.0.0.1:54321/functions/v1/api
    description: Supabase Edge local
  - url: https://lsbgegbghlgxkqxpmgyx.supabase.co/functions/v1/api
    description: Supabase carDoc
# OPTIONS is public and handled by the gateway or Express CORS middleware.
# Bearer tokens authenticate protected routes; browser cookies are not used.
paths:
  /ping:
    get:
      responses:
        "200":
          description: Backend is running
  /login:
    post:
      summary: Authenticate with Supabase using email and password
      description: Returns a Supabase session for Bearer authentication.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated; Cache-Control is no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Invalid JSON or body
        "401":
          description: Invalid credentials or unavailable account
        "413":
          description: Body exceeds 8 KB
        "429":
          description: Supabase rate limit exceeded
        "503":
          description: Authentication unavailable or unconfigured
  /auth/me:
    get:
      summary: Retrieve the current authenticated user
      description: The shared requireAuth middleware validates the Bearer access token with Supabase Auth; the controller returns the verified user without another lookup. No request body is used.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user; Cache-Control is no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: Missing, malformed, invalid or expired Bearer token, or missing user
          headers:
            WWW-Authenticate:
              schema:
                type: string
                enum: [Bearer]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "429":
          description: Supabase rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "503":
          description: Authentication unavailable or unconfigured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
  /customers:
    get:
      summary: List customers
      description: |
        Returns the shared customer list for authenticated users, ordered by ID ascending.
        Archived customers are excluded unless includeArchived=true.
        Unknown or repeated query parameters are rejected. Pages beyond the last page
        return an empty data array and the requested page metadata.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            maximum: 9007199254740991
            default: 1
          description: The calculated offset must also be a safe integer.
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - in: query
          name: includeArchived
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Paginated customers; Cache-Control is no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerListResponse"
        "400":
          description: Invalid, unknown or repeated query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "401":
          description: Missing, malformed, invalid or expired Bearer token
          headers:
            WWW-Authenticate:
              schema:
                type: string
                enum: [Bearer]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "429":
          description: Supabase authentication rate limit exceeded
        "500":
          description: Database unavailable or unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "503":
          description: Authentication unavailable or unconfigured
  /logout:
    post:
      summary: Sign out the current Supabase session
      description: |
        The shared requireAuth middleware validates the access token in Authorization
        before logout runs. Revokes only the current session's
        refresh tokens. Other sessions remain active. The access token remains valid
        until expiration; the client must delete its locally stored session tokens.
        No request body is used.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Session signed out; no body; Cache-Control is no-store
        "401":
          description: Missing, malformed, invalid or expired Bearer token
        "429":
          description: Supabase rate limit exceeded
        "503":
          description: Authentication unavailable or unconfigured
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CustomerResponse:
      type: object
      additionalProperties: false
      required:
        [
          id,
          firstName,
          lastName,
          email,
          phone,
          address,
          documentNumber,
          notes,
          isActive,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        documentNumber:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PaginationMeta:
      type: object
      additionalProperties: false
      required: [page, pageSize, total, totalPages, hasNextPage, hasPreviousPage]
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
        hasNextPage:
          type: boolean
        hasPreviousPage:
          type: boolean
    CustomerListResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/CustomerResponse"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
    AuthError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
    UserResponse:
      type: object
      additionalProperties: false
      required: [id, email]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          nullable: true
    MeResponse:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/UserResponse"
    LoginInput:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 4096
    LoginResponse:
      type: object
      required: [user, session]
      properties:
        user:
          $ref: "#/components/schemas/UserResponse"
        session:
          type: object
          required: [access_token, refresh_token, token_type, expires_in]
          properties:
            access_token:
              type: string
            refresh_token:
              type: string
            token_type:
              type: string
            expires_in:
              type: integer
            expires_at:
              type: integer
